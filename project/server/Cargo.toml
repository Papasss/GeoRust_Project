[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
bcrypt = "0.15"
serde_json= "1.0"
rpassword = "7.3"
cpu-time = "1.0"
shared = { path = "../shared" }
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
serial_test = "3"